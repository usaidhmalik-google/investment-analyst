# Shared proxy settings for /api/ and /healthz (included inside a location).
# $backend is set in the server block from ${BACKEND_URL}; using a variable
# makes nginx resolve the host at request time via `resolver`, and passes the
# original request URI through unchanged.
proxy_pass $backend;

proxy_http_version 1.1;
proxy_set_header Connection "";

# Cloud Run routes on the Host header / SNI, so they must be the backend's own
# hostname, not the frontend's.
proxy_set_header Host $backend_host;
proxy_ssl_server_name on;
proxy_ssl_name $backend_sni;

proxy_set_header X-Real-IP $remote_addr;
proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
proxy_set_header X-Forwarded-Proto $scheme;
proxy_set_header X-Forwarded-Host $host;

# Optional service-to-service ID token (written by 25-backend-id-token.sh; empty when disabled).
include /etc/nginx/snippets/backend-auth.conf;

# Identity headers injected by IAP; the backend verifies the JWT.
proxy_set_header X-Goog-IAP-JWT-Assertion $http_x_goog_iap_jwt_assertion;
proxy_set_header X-Goog-Authenticated-User-Email $http_x_goog_authenticated_user_email;
proxy_set_header X-Goog-Authenticated-User-Id $http_x_goog_authenticated_user_id;

# Server-Sent Events: stream bytes as they arrive.
proxy_buffering off;
proxy_cache off;
proxy_request_buffering off;
chunked_transfer_encoding on;
proxy_read_timeout 300s;
proxy_send_timeout 300s;
proxy_connect_timeout 10s;

add_header X-Accel-Buffering no always;
add_header Cache-Control "no-store" always;
include /etc/nginx/snippets/security-headers.conf;
